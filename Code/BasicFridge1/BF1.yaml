substitutions:
  name: fridge_bf1

esphome:
  name: ${name}
  friendly_name: "SmartFridge BF1"
  min_version: 2024.6.0

esp32:
  board: esp32-s3-devkitc1-n16r8
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: 192.168.1.88
    gateway: 192.168.1.1
    subnet: 255.255.255.0
  ap:
    ssid: "${name}_fallback"
    password: "fridge1234"

captive_portal:

logger:
  level: VERBOSE
  tx_buffer_size: 256

api:
  encryption:
    key: !secret esphome_api_key

  services:
    - service: camera_set_param
      variables:
        name: string
        value: int
      then:
        - lambda: |-
            bool ok = false;
            if (("contrast" == name) && (value >= -2) && (value <= 2)) { id(espcam).set_contrast(value); ok = true; }
            if (("brightness" == name) && (value >= -2) && (value <= 2)) { id(espcam).set_brightness(value); ok = true; }
            if (("saturation" == name) && (value >= -2) && (value <= 2)) { id(espcam).set_saturation(value); ok = true; }
            if (("special_effect" == name) && (value >= 0U) && (value <= 6U)) { id(espcam).set_special_effect((esphome::esp32_camera::ESP32SpecialEffect)value); ok = true; }
            if (("aec_mode" == name) && (value >= 0U) && (value <= 1U)) { id(espcam).set_aec_mode((esphome::esp32_camera::ESP32GainControlMode)value); ok = true; }
            if (("aec2" == name) && (value >= 0U) && (value <= 1U)) { id(espcam).set_aec2(value); ok = true; }
            if (("ae_level" == name) && (value >= -2) && (value <= 2)) { id(espcam).set_ae_level(value); ok = true; }
            if (("aec_value" == name) && (value >= 0U) && (value <= 1200U)) { id(espcam).set_aec_value(value); ok = true; }
            if (("agc_mode" == name) && (value >= 0U) && (value <= 1U)) { id(espcam).set_agc_mode((esphome::esp32_camera::ESP32GainControlMode)value); ok = true; }
            if (("agc_value" == name) && (value >= 0U) && (value <= 30U)) { id(espcam).set_agc_value(value); ok = true; }
            if (("agc_gain_ceiling" == name) && (value >= 0U) && (value <= 6U)) { id(espcam).set_agc_gain_ceiling((esphome::esp32_camera::ESP32AgcGainCeiling)value); ok = true; }
            if (("wb_mode" == name) && (value >= 0U) && (value <= 4U)) { id(espcam).set_wb_mode((esphome::esp32_camera::ESP32WhiteBalanceMode)value); ok = true; }
            if (("test_pattern" == name) && (value >= 0U) && (value <= 1U)) { id(espcam).set_test_pattern(value); ok = true; }

            if (ok) id(espcam).update_camera_parameters();

ota:
  - platform: esphome
    password: !secret esphome_ota_password

# I2C: lista di bus (camera + sensori/display)
i2c:
  - id: cam_i2c
    sda: GPIO4
    scl: GPIO5
    scan: false

  - id: sensor_i2c
    sda: GPIO14
    scl: GPIO20
    scan: true

# Display LCD PCF8574 (20x4)
display:
  - platform: lcd_pcf8574
    id: main_display
    i2c_id: sensor_i2c
    address: 0x27
    dimensions: 20x4
    lambda: |-
      it.printf(0, 0, "F:%.1fC  Z:%.1fC", id(fridge_temp).state, id(freezer_temp).state);
      it.printf(0, 1, "HumF:%.0f%% HumZ:%.0f%%", id(fridge_humidity).state, id(freezer_humidity).state);
      it.printf(0, 2, "PF:%.0fW  PZ:%.0fW", id(fridge_compressor_power).state, id(freezer_compressor_power).state);
      it.printf(0, 3, "Mode:%s SPF:%.1f SPZ:%.1f", id(compressor_mode).state.c_str(), id(fridge_setpoint), id(freezer_setpoint));

# Sensori (SHT4x x2 + HLW8012 x2)
sensor:
  - platform: sht4x
    i2c_id: sensor_i2c
    id: fridge_sht
    temperature:
      id: fridge_temp
      name: "Fridge Temperature"
    humidity:
      id: fridge_humidity
      name: "Fridge Humidity"

  - platform: sht4x
    i2c_id: sensor_i2c
    id: freezer_sht
    temperature:
      id: freezer_temp
      name: "Freezer Temperature"
    humidity:
      id: freezer_humidity
      name: "Freezer Humidity"

  - platform: hlw8012
    sel_pin: GPIO33
    cf_pin: GPIO34
    cf1_pin: GPIO35
    current:
      name: "Fridge Compressor Current"
    voltage:
      name: "Fridge Compressor Voltage"
    power:
      name: "Fridge Compressor Power"
      id: fridge_compressor_power
    energy:
      name: "Fridge Compressor Energy"
    update_interval: 5s

  - platform: hlw8012
    sel_pin: GPIO36
    cf_pin: GPIO37
    cf1_pin: GPIO39
    current:
      name: "Freezer Compressor Current"
    voltage:
      name: "Freezer Compressor Voltage"
    power:
      name: "Freezer Compressor Power"
      id: freezer_compressor_power
    energy:
      name: "Freezer Compressor Energy"
    update_interval: 5s

# Camera (OV2640) — configurazione suggerita
esp32_camera:
  id: espcam
  name: "Fridge Camera"
  external_clock:
    pin: GPIO15
    frequency: 20MHz
  i2c_id: cam_i2c
  data_pins: [GPIO11, GPIO9, GPIO8, GPIO10, GPIO12, GPIO18, GPIO17, GPIO16]
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13
  resolution: 1600x1200
  jpeg_quality: 10
  max_framerate: 1.0fps
  idle_framerate: 0.2fps
  vertical_flip: true
  horizontal_mirror: false

# Binary sensors (porte)
binary_sensor:
  - platform: gpio
    id: fridge_door
    name: "Fridge Door"
    pin:
      number: GPIO19
      mode: INPUT_PULLUP
      inverted: true

  - platform: gpio
    id: freezer_door
    name: "Freezer Door"
    pin:
      number: GPIO26
      mode: INPUT_PULLUP
      inverted: true

  - platform: status
    id: ha_status
    name: "HA API Status"

# Output (lista)
output:
  - platform: gpio
    id: fridge_light_output
    pin: GPIO21

  - platform: gpio
    id: wifi_led
    pin: GPIO22

# Light (lista)
light:
  - platform: binary
    id: fridge_light
    name: "Fridge Light"
    output: fridge_light_output

  - platform: binary
    id: wifi_status_led
    name: "WiFi Status LED"
    output: wifi_led

# Switch (compressori)
switch:
  - platform: gpio
    id: fridge_compressor_relay
    name: "Fridge Compressor Relay"
    pin: GPIO2

  - platform: gpio
    id: freezer_compressor_relay
    name: "Freezer Compressor Relay"
    pin: GPIO3

# Mode selection
select:
  - platform: template
    id: compressor_mode
    name: "Compressor Control Mode"
    optimistic: true
    options:
      - "Home Assistant"
      - "Internal Logic"
    initial_option: "Internal Logic"

# Setpoints regolabili (number)
number:
  - platform: template
    id: fridge_setpoint_number
    name: "Fridge Setpoint"
    optimistic: true
    min_value: 1.0
    max_value: 10.0
    step: 0.5
    initial_value: '4.0'
    set_action:
      - lambda: |-
          id(fridge_setpoint) = x;

  - platform: template
    id: freezer_setpoint_number
    name: "Freezer Setpoint"
    optimistic: true
    min_value: -25.0
    max_value: -10.0
    step: 0.5
    initial_value: '-18.0'
    set_action:
      - lambda: |-
          id(freezer_setpoint) = x;

# Globals
globals:
  - id: fridge_setpoint
    type: float
    initial_value: '4.0'

  - id: fridge_hysteresis
    type: float
    initial_value: '1.0'

  - id: freezer_setpoint
    type: float
    initial_value: '-18.0'

  - id: freezer_hysteresis
    type: float
    initial_value: '2.0'

  - id: fridge_min_off_time
    type: int
    initial_value: '300'

  - id: freezer_min_off_time
    type: int
    initial_value: '300'

  - id: fridge_lockout
    type: bool
    initial_value: 'false'

  - id: freezer_lockout
    type: bool
    initial_value: 'false'

# Lockout scripts
script:
  - id: fridge_off_lockout
    mode: restart
    then:
      - lambda: |-
          id(fridge_lockout) = true;
      - delay: !lambda "return id(fridge_min_off_time) * 1000;"
      - lambda: |-
          id(fridge_lockout) = false;

  - id: freezer_off_lockout
    mode: restart
    then:
      - lambda: |-
          id(freezer_lockout) = true;
      - delay: !lambda "return id(freezer_min_off_time) * 1000;"
      - lambda: |-
          id(freezer_lockout) = false;

# Internal logic + fallback
interval:
  - interval: 30s
    then:
      - lambda: |-
          const bool ha_connected = id(ha_status).state;
          const bool internal_mode = id(compressor_mode).state == "Internal Logic";
          const bool use_internal = internal_mode || !ha_connected;

          if (use_internal) {
            if (!id(fridge_lockout)) {
              if (id(fridge_temp).state > id(fridge_setpoint) + id(fridge_hysteresis)) {
                id(fridge_compressor_relay).turn_on();
              } else if (id(fridge_temp).state < id(fridge_setpoint) - id(fridge_hysteresis)) {
                id(fridge_compressor_relay).turn_off();
                id(fridge_off_lockout).execute();
              }
            }

            if (!id(freezer_lockout)) {
              if (id(freezer_temp).state > id(freezer_setpoint) + id(freezer_hysteresis)) {
                id(freezer_compressor_relay).turn_on();
              } else if (id(freezer_temp).state < id(freezer_setpoint) - id(freezer_hysteresis)) {
                id(freezer_compressor_relay).turn_off();
                id(freezer_off_lockout).execute();
              }
            }
          }
