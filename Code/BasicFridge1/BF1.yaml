substitutions:
  name: fridge_bf1

esphome:
  name: ${name}
  comment: "BF1 Template: Dual compressor, Dallas + SHT41, camera, HMI type 2 (no buttons), power metering, HA/internal logic"
  min_version: 2024.6.0

esp32:
  board: esp32cam
  framework:
    type: arduino

# -------------------------------------------------------
#  Wi-Fi provisioning via Improv BLE + fallback AP
# -------------------------------------------------------
wifi:
  ap:
    ssid: "${name}_setup"
    password: "fridge1234"

improv_serial:
improv_ble:
captive_portal:

logger:

# -------------------------------------------------------
#  API protected
# -------------------------------------------------------
api:
  encryption:
    key: !secret esphome_api_key
  reboot_timeout: 15min

# -------------------------------------------------------
#  OTA protected
# -------------------------------------------------------
ota:
  password: !secret esphome_ota_password

time:
  - platform: homeassistant
    id: system_time

# -------------------------------------------------------
#  I2C BUS (LCD + SHT41)
# -------------------------------------------------------
i2c:
  sda: GPIO16
  scl: GPIO0
  scan: true

# -------------------------------------------------------
#  Dallas 1-Wire bus (temperature)
# -------------------------------------------------------
dallas:
  pin: GPIO13

# -------------------------------------------------------
#  DISPLAY (HMI type 2, no buttons)
# -------------------------------------------------------
display:
  - platform: lcd_pcf8574
    id: main_display
    dimensions: 20x4
    address: 0x27
    lambda: |-
      // Riga 1: Temperature
      it.printf(0, 0, "Fridge: %.1fC  Freez: %.1fC",
                id(fridge_temp).state,
                id(freezer_temp).state);

      // Riga 2: Umidità
      it.printf(0, 1, "Hum F: %.0f%%  Hum Z: %.0f%%",
                id(fridge_humidity).state,
                id(freezer_humidity).state);

      // Riga 3: Consumo istantaneo (W)
      it.printf(0, 2, "P F: %.0fW  P Z: %.0fW",
                id(fridge_compressor_power).state,
                id(freezer_compressor_power).state);

      // Riga 4: Modalità operativa
      it.printf(0, 3, "Mode: %s",
                id(compressor_mode).state.c_str());
# -------------------------------------------------------
#  CAMERA (C in fridge cellar)
# -------------------------------------------------------
esp32_camera:
  name: "Fridge Camera"
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  resolution: 640x480
  jpeg_quality: 10

# -------------------------------------------------------
#  SENSORS: Temperature + Humidity + Power
# -------------------------------------------------------
sensor:
  # Fridge temperature (Dallas)
  - platform: dallas
    address: 0x28FF4C916317032C
    id: fridge_temp
    name: "Fridge Temperature"

  # Freezer temperature (Dallas)
  - platform: dallas
    address: 0x28FFB2A1C41703D1
    id: freezer_temp
    name: "Freezer Temperature"

  # Fridge humidity (SHT41)
  - platform: sht4x
    id: fridge_humidity
    temperature:
      name: "Fridge Humidity Temperature"
    humidity:
      name: "Fridge Relative Humidity"

  # Freezer humidity (SHT41)
  - platform: sht4x
    id: freezer_humidity
    temperature:
      name: "Freezer Humidity Temperature"
    humidity:
      name: "Freezer Relative Humidity"

  # Power metering – Fridge compressor (HLW8012)
  - platform: hlw8012
    sel_pin: GPIO26
    cf_pin: GPIO27
    cf1_pin: GPIO14
    current:
      name: "Fridge Compressor Current"
    voltage:
      name: "Fridge Compressor Voltage"
    power:
      name: "Fridge Compressor Power"
    energy:
      name: "Fridge Compressor Energy"
    update_interval: 5s

  # Power metering – Freezer compressor (HLW8012)
  - platform: hlw8012
    sel_pin: GPIO32
    cf_pin: GPIO33
    cf1_pin: GPIO15
    current:
      name: "Freezer Compressor Current"
    voltage:
      name: "Freezer Compressor Voltage"
    power:
      name: "Freezer Compressor Power"
    energy:
      name: "Freezer Compressor Energy"
    update_interval: 5s

# -------------------------------------------------------
#  DOOR & DISPENSER SENSORS + HA STATUS
# -------------------------------------------------------
binary_sensor:
  - platform: gpio
    id: fridge_door
    name: "Fridge Door"
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true

  - platform: gpio
    id: freezer_door
    name: "Freezer Door"
    pin:
      number: GPIO12
      mode: INPUT_PULLUP
      inverted: true

  - platform: gpio
    id: fridge_dispenser
    name: "Fridge Dispenser"
    pin:
      number: GPIO17
      mode: INPUT_PULLUP
      inverted: true

  # HA API status (for fallback)
  - platform: status
    id: ha_status
    name: "HA API Status"

# -------------------------------------------------------
#  LIGHTS (L only in fridge cellar)
# -------------------------------------------------------
output:
  - platform: gpio
    id: fridge_light_output
    pin: GPIO2

light:
  - platform: binary
    id: fridge_light
    name: "Fridge Light"
    output: fridge_light_output

# -------------------------------------------------------
#  ACTUATORS: Dual compressors (A1/A2)
# -------------------------------------------------------
switch:
  # Physical relays – compressors
  - platform: gpio
    id: fridge_compressor_relay
    name: "Fridge Compressor Relay"
    pin: GPIO19

  - platform: gpio
    id: freezer_compressor_relay
    name: "Freezer Compressor Relay"
    pin: GPIO21

  # HA-exposed compressor control switches
  - platform: template
    id: fridge_compressor_control
    name: "Fridge Compressor Control (HA)"
    turn_on_action:
      - switch.turn_on: fridge_compressor_relay
    turn_off_action:
      - switch.turn_off: fridge_compressor_relay

  - platform: template
    id: freezer_compressor_control
    name: "Freezer Compressor Control (HA)"
    turn_on_action:
      - switch.turn_on: freezer_compressor_relay
    turn_off_action:
      - switch.turn_off: freezer_compressor_relay

# -------------------------------------------------------
#  MODE SELECTION: HA vs Internal Logic
# -------------------------------------------------------
select:
  - platform: template
    id: compressor_mode
    name: "Compressor Control Mode"
    optimistic: true
    options:
      - "Home Assistant"
      - "Internal Logic"
    initial_option: "Internal Logic"

# -------------------------------------------------------
#  GLOBALS: Setpoints, hysteresis, lockouts
# -------------------------------------------------------
globals:
  # Fridge thermostat
  - id: fridge_setpoint
    type: float
    initial_value: 4.0
  - id: fridge_hysteresis
    type: float
    initial_value: 1.0

  # Freezer thermostat
  - id: freezer_setpoint
    type: float
    initial_value: -18.0
  - id: freezer_hysteresis
    type: float
    initial_value: 2.0

  # Minimum off-time lockouts (seconds)
  - id: fridge_min_off_time
    type: int
    initial_value: 300    # 5 minutes
  - id: freezer_min_off_time
    type: int
    initial_value: 300    # 5 minutes

  # Lockout flags
  - id: fridge_lockout
    type: bool
    initial_value: false
  - id: freezer_lockout
    type: bool
    initial_value: false

# -------------------------------------------------------
#  SCRIPTS: Lockout timers
# -------------------------------------------------------
script:
  # Fridge compressor minimum off-time
  - id: fridge_off_lockout
    mode: restart
    then:
      - lambda: |-
          id(fridge_lockout) = true;
      - delay: !lambda "return id(fridge_min_off_time) * 1000;"
      - lambda: |-
          id(fridge_lockout) = false;

  # Freezer compressor minimum off-time
  - id: freezer_off_lockout
    mode: restart
    then:
      - lambda: |-
          id(freezer_lockout) = true;
      - delay: !lambda "return id(freezer_min_off_time) * 1000;"
      - lambda: |-
          id(freezer_lockout) = false;

# -------------------------------------------------------
#  INTERNAL LOGIC: Dual thermostats + HA fallback
# -------------------------------------------------------
interval:
  - interval: 30s
    then:
      - lambda: |-
          const bool ha_connected = id(ha_status).state;
          const bool internal_mode = id(compressor_mode).state == "Internal Logic";

          // Internal logic active if:
          // - mode = Internal Logic OR
          // - HA not connected
          const bool use_internal = internal_mode || !ha_connected;

          if (use_internal) {
            // -----------------------------
            // Fridge thermostat with lockout
            // -----------------------------
            if (!id(fridge_lockout)) {
              if (id(fridge_temp).state > id(fridge_setpoint) + id(fridge_hysteresis)) {
                id(fridge_compressor_relay).turn_on();
              } else if (id(fridge_temp).state < id(fridge_setpoint) - id(fridge_hysteresis)) {
                id(fridge_compressor_relay).turn_off();
                id(fridge_off_lockout).execute();
              }
            }

            // -----------------------------
            // Freezer thermostat with lockout
            // -----------------------------
            if (!id(freezer_lockout)) {
              if (id(freezer_temp).state > id(freezer_setpoint) + id(freezer_hysteresis)) {
                id(freezer_compressor_relay).turn_on();
              } else if (id(freezer_temp).state < id(freezer_setpoint) - id(freezer_hysteresis)) {
                id(freezer_compressor_relay).turn_off();
                id(freezer_off_lockout).execute();
              }
            }
          }
